<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5a623">
<title>Construction Crew — Colors, Letters & Numbers</title>
<style>
  :root{
    --dark:#2b2118;
    --panel:#fff8e7;
    --shadow:0 8px 0 rgba(0,0,0,.22);
    --tile:clamp(110px, min(26vw, 34vh), 230px);
  }
  /* tall/narrow screens: tiles side by side would be tiny, so let them wrap */
  @media (max-aspect-ratio: 4/5){
    :root{ --tile:min(40vw, 26vh); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:"Trebuchet MS","Verdana",system-ui,-apple-system,sans-serif;
    background:#f5a623;
    background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 28px, rgba(0,0,0,0) 28px 56px);
    color:var(--dark);
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .hazard{height:14px;flex:0 0 14px;
    background:repeating-linear-gradient(45deg,#111 0 18px,#ffcc00 18px 36px);}

  /* ---------- top bar ---------- */
  #bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:56px;}
  .iconbtn{
    border:0;background:rgba(0,0,0,.16);color:#fff;
    font-size:22px;line-height:1;border-radius:14px;
    width:52px;height:44px;cursor:pointer;
  }
  .iconbtn:active{transform:translateY(2px);}
  #bar.atmenu #homeBtn, #bar.atmenu #sayBtn{display:none;}
  #score{
    margin-left:auto;display:flex;gap:4px;align-items:center;
    font-size:clamp(16px,4.4vw,24px);letter-spacing:1px;min-height:30px;
    white-space:nowrap;overflow:hidden;
  }

  /* ---------- screens ---------- */
  #stage{flex:1 1 auto;position:relative;overflow:hidden;}
  .screen{
    position:absolute;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    padding:4px 12px 12px;
  }
  .screen.on{display:flex;}

  /* ---------- menu ---------- */
  #title{
    font-size:clamp(18px,5.9vw,54px);font-weight:900;color:#fff;
    text-shadow:0 4px 0 rgba(0,0,0,.28);text-align:center;line-height:1.1;
    margin-bottom:4px;white-space:nowrap;
  }
  #subtitle{font-size:clamp(14px,3.4vw,22px);color:#3d2d19;margin-bottom:20px;opacity:.85;}
  .menuwrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .bigbtn{
    border:0;cursor:pointer;border-radius:28px;
    background:var(--panel);box-shadow:var(--shadow);
    padding:20px 22px;min-width:min(40vw,220px);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    font-family:inherit;color:var(--dark);
  }
  .bigbtn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.22);}
  .bigbtn .ico{font-size:clamp(44px,11vw,80px);line-height:1;}
  .bigbtn .lbl{font-size:clamp(20px,5vw,32px);font-weight:900;letter-spacing:1px;}
  .grownup{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px;}
  .minibtn{
    border:0;cursor:pointer;font-family:inherit;
    background:rgba(0,0,0,.14);color:#4a3517;
    border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;
    max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .minibtn:active{transform:translateY(2px);}

  /* ---------- play ---------- */
  #prompt{flex:0 0 auto;text-align:center;margin-bottom:10px;}
  #promptText{
    font-size:clamp(20px,5.6vw,42px);font-weight:900;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  #promptText .target{
    display:inline-block;background:#fff;color:var(--dark);
    padding:2px 16px;border-radius:14px;text-shadow:none;
    box-shadow:0 4px 0 rgba(0,0,0,.22);
  }
  #choices{
    flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;
    gap:clamp(10px,3vw,28px);flex-wrap:wrap;align-content:center;
  }
  .choice{
    border:0;padding:0;cursor:pointer;background:transparent;
    display:flex;align-items:center;justify-content:center;
    width:var(--tile);height:var(--tile);
    border-radius:30px;position:relative;
    box-shadow:0 8px 0 rgba(0,0,0,.25);
    transition:transform .12s ease, opacity .3s ease;
    font-family:inherit;
  }
  /* four options need to be a little smaller to stay on screen */
  #choices.four .choice{ width:calc(var(--tile)*.82); height:calc(var(--tile)*.82); }
  .choice:active{transform:translateY(4px) scale(.98);}
  /* the emoji is drained of its own colour so the TILE colour is the only
     colour in play — otherwise a green tractor on a yellow tile teaches
     the wrong thing. */
  .choice .emo{
    font-size:calc(var(--tile) * .52);line-height:1;
    filter:grayscale(1) contrast(.85) brightness(1.35) drop-shadow(0 3px 2px rgba(0,0,0,.45));
    opacity:.95;pointer-events:none;
  }
  #choices.four .choice .emo{ font-size:calc(var(--tile) * .43); }
  .choice .letter{
    font-size:calc(var(--tile) * .62);font-weight:900;line-height:1;
    color:#1b1b1b;pointer-events:none;
    text-shadow:0 3px 0 rgba(255,255,255,.55);
  }
  #choices.four .choice .letter{ font-size:calc(var(--tile) * .5); }
  .choice .letter.two{ font-size:calc(var(--tile) * .42); letter-spacing:-2px; }
  #choices.four .choice .letter.two{ font-size:calc(var(--tile) * .34); }
  .choice .cap{
    position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    font-size:26px;pointer-events:none;
  }
  /* while the voice is speaking, taps do nothing */
  #choices.waiting .choice{ pointer-events:none; }
  #choices.waiting{ opacity:.92; }
  /* an option removed by the helper hand after repeated misses */
  .choice.gone{ opacity:.12;pointer-events:none;transform:scale(.9); }
  .choice.wrong{animation:shake .45s;}
  .choice.right{animation:pop .5s;z-index:5;}
  .choice.fade{opacity:.28;}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-12px) rotate(-4deg)}
    40%{transform:translateX(12px) rotate(4deg)}
    60%{transform:translateX(-8px) rotate(-3deg)}
    80%{transform:translateX(8px) rotate(3deg)}
  }
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22) rotate(-3deg)}100%{transform:scale(1)}}

  /* ---------- things to count ---------- */
  #countBox{
    flex:0 0 auto;display:none;
    max-width:min(96vw,700px);margin:0 auto 8px;
    background:rgba(255,255,255,.22);border-radius:22px;padding:8px 14px;
  }
  #countBox.on{display:grid;}
  #countBox.row{ grid-auto-flow:column;gap:6px;align-items:center;justify-items:center; }
  #countBox.dice{ grid-template-columns:repeat(3,1fr);gap:4px; }
  #countBox.frame{ grid-template-columns:repeat(5,1fr);gap:5px; }
  .cell{
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(26px,6.4vw,54px);line-height:1;
    min-width:1.05em;min-height:1.05em;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.3));
    transition:transform .18s ease;
  }
  .cell.empty{ filter:none; }
  /* a ten-frame only teaches "five and two more" if you can see the empties */
  #countBox.frame .cell{
    border:2px dashed rgba(255,255,255,.55);border-radius:8px;
    background:rgba(255,255,255,.10);
  }
  .cell.tick{ transform:scale(1.28); }
  .cell.counted{ filter:drop-shadow(0 0 6px #fff) drop-shadow(0 2px 1px rgba(0,0,0,.3)); }

  /* ---------- build progress ---------- */
  #site{
    flex:0 0 auto;height:52px;width:100%;max-width:620px;
    display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:6px;
  }
  .brick{
    width:44px;height:24px;border-radius:6px;background:rgba(255,255,255,.22);
    border:3px dashed rgba(255,255,255,.4);
  }
  .brick.filled{
    background:#c0392b;border:3px solid #8e2b20;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);
  }
  /* only the brick he just earned drops in — animating the whole row every
     round made the finished part of the wall look unfinished again */
  .brick.filled.justlaid{ animation:drop .4s ease-out; }
  @keyframes drop{0%{transform:translateY(-60px);opacity:0}100%{transform:none;opacity:1}}

  /* ---------- celebration ---------- */
  #cheer{
    position:absolute;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.45);z-index:20;text-align:center;padding:6px;overflow:hidden;
  }
  #cheer.on{display:flex;}
  #cheerText{
    font-size:clamp(24px,6.4vw,54px);font-weight:900;color:#fff;
    text-shadow:0 5px 0 rgba(0,0,0,.35);max-width:96%;line-height:1.08;padding:0 8px;
  }
  #cheerEmo{font-size:clamp(58px,15vw,120px);line-height:1.4;margin-bottom:10px;animation:pop .6s;}
  .confetti{position:absolute;width:14px;height:20px;border-radius:3px;top:-30px;z-index:30;pointer-events:none;}
  #truck,#truck2{
    position:absolute;bottom:6px;left:-140px;font-size:clamp(48px,13vw,90px);
    z-index:25;pointer-events:none;display:none;
  }
  #truck2{bottom:4px;font-size:clamp(38px,10vw,72px);}
  #truck.go{display:block;animation:drive 2.6s linear;}
  #truck2.go{display:block;animation:drive 3.1s linear .5s;}
  @keyframes drive{from{left:-140px} to{left:110%}}

  #tower{display:none;flex-direction:column-reverse;align-items:center;gap:3px;margin-bottom:8px;}
  #tower.on{display:flex;}
  .floor{
    width:clamp(96px,26vw,200px);height:clamp(15px,3.6vw,26px);
    background:#c0392b;border:3px solid #8e2b20;border-radius:5px;
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.16);animation:rise .45s ease-out both;
  }
  .floor.cap{width:clamp(112px,30vw,230px);background:#8e2b20;border-color:#63201a;height:clamp(11px,2.6vw,18px);}
  #towerTop{font-size:clamp(34px,9vw,64px);line-height:1;animation:rise .5s ease-out both;}
  @keyframes rise{0%{transform:translateY(46px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
  .firework{
    position:absolute;font-size:clamp(40px,11vw,84px);
    z-index:21;pointer-events:none;animation:boom 1.5s ease-out both;
  }
  @keyframes boom{
    0%{transform:scale(.2);opacity:0}25%{transform:scale(1.15);opacity:1}
    70%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}
  }
  #tower,#cheerEmo,#cheerText{position:relative;z-index:24;}

  /* ---------- progress panel (for grown-ups) ---------- */
  #progress{
    position:absolute;inset:0;display:none;z-index:40;
    background:#241a10;color:#fff;
    padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #progress.on{display:block;}
  #progress h2{margin:0 0 4px;font-size:clamp(18px,4.6vw,26px);}
  #progress .sub{opacity:.7;font-size:13px;margin-bottom:14px;}
  .pcard{background:rgba(255,255,255,.10);border-radius:16px;padding:12px 14px;margin-bottom:12px;}
  .pcard h3{margin:0 0 8px;font-size:clamp(15px,3.8vw,20px);}
  .pline{font-size:clamp(13px,3.2vw,16px);margin:4px 0;opacity:.95;}
  .bar{height:16px;border-radius:8px;background:rgba(255,255,255,.16);position:relative;margin:8px 0 4px;overflow:hidden;}
  .bar > i{position:absolute;left:0;top:0;bottom:0;background:#4ec36b;border-radius:8px;}
  .bar > b{position:absolute;top:-3px;bottom:-3px;width:3px;background:#ffd43b;}
  .chip{
    display:inline-block;background:#c0392b;border-radius:10px;
    padding:3px 9px;margin:3px 4px 0 0;font-size:clamp(13px,3.2vw,16px);font-weight:700;
  }
  .chip.ok{background:rgba(255,255,255,.16);}
  #progClose{
    display:block;margin:6px auto 20px;border:0;cursor:pointer;font-family:inherit;
    background:#ffcc00;color:#2b2118;border-radius:999px;padding:11px 26px;font-size:16px;font-weight:900;
  }
  .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;color:rgba(0,0,0,.45);padding:0 10px;}

  /* ---------- short screens (phone held sideways) ---------- */
  @media (max-height: 500px){
    :root{ --tile:min(21vw, 40vh); }
    #bar{min-height:42px;padding:4px 8px;}
    .iconbtn{height:36px;width:46px;font-size:19px;}
    #promptText{font-size:clamp(16px,3.9vw,25px);}
    #prompt{margin-bottom:4px;}
    #countBox{padding:4px 10px;margin-bottom:4px;border-radius:16px;}
    .cell{font-size:clamp(17px,3.9vw,30px);}
    #site{height:24px;}
    .brick{width:32px;height:13px;border-width:2px;}
    #title{font-size:clamp(18px,5vw,38px);margin-bottom:0;}
    #subtitle{margin-bottom:8px;}
    .menuwrap{gap:10px;}
    .bigbtn{flex-direction:row;gap:10px;padding:10px 16px;min-width:0;border-radius:20px;}
    .bigbtn .ico{font-size:clamp(24px,5.2vw,34px);}
    .bigbtn .lbl{font-size:clamp(15px,3.6vw,22px);}
    .grownup{margin-top:10px;}
    .hint{display:none;}
    #tower{gap:2px;margin-bottom:4px;}
    .floor{width:clamp(70px,18vw,140px);height:11px;border-width:2px;}
    .floor.cap{width:clamp(84px,21vw,160px);height:8px;}
    #towerTop{font-size:clamp(22px,5.5vw,34px);}
    #cheerEmo{font-size:clamp(30px,7.4vw,46px);line-height:1.5;margin-bottom:4px;}
    #cheerText{font-size:clamp(18px,4.6vw,30px);line-height:1.05;}
    .firework{font-size:clamp(26px,7vw,46px);}
    #truck,#truck2{font-size:clamp(26px,6.5vw,44px);bottom:2px;}
    #cheer{padding-bottom:46px;}
  }
</style>
</head>
<body>
<div class="hazard"></div>

<div id="bar">
  <button class="iconbtn" id="homeBtn" aria-label="Back to menu" title="Menu">🏠</button>
  <button class="iconbtn" id="sayBtn" aria-label="Say it again" title="Say it again">🔁</button>
  <button class="iconbtn" id="muteBtn" aria-label="Sound on or off" title="Sound">🔊</button>
  <div id="score"></div>
</div>

<div id="stage">

  <section class="screen on" id="menuScreen">
    <div id="title">🚧 CONSTRUCTION CREW 🚧</div>
    <div id="subtitle">Pick a job, boss!</div>
    <div class="menuwrap">
      <button class="bigbtn" data-mode="colors"><span class="ico">🎨</span><span class="lbl">COLORS</span></button>
      <button class="bigbtn" data-mode="letters"><span class="ico">🔤</span><span class="lbl">LETTERS</span></button>
      <button class="bigbtn" data-mode="numbers"><span class="ico">🔢</span><span class="lbl">NUMBERS</span></button>
    </div>
    <div class="grownup">
      <button class="minibtn" id="voiceBtn" title="Change the speaking voice">🗣️ Voice: checking…</button>
      <button class="minibtn" id="progBtn" title="Progress so far">📋 How's it going?</button>
    </div>
    <div class="hint">Tap a job to start · 🔊 turns the voice on and off</div>
  </section>

  <section class="screen" id="playScreen">
    <div id="prompt"><div id="promptText"></div></div>
    <div id="countBox"></div>
    <div id="choices"></div>
    <div id="site"></div>
  </section>

  <div id="cheer">
    <div id="tower"></div>
    <div id="cheerEmo">🎉</div>
    <div id="cheerText">GREAT JOB!</div>
  </div>
  <div id="truck">🚚</div>
  <div id="truck2">🚜</div>

  <div id="progress">
    <h2>📋 How's it going?</h2>
    <div class="sub" id="progSub"></div>
    <div id="progBody"></div>
    <button id="progClose">Close</button>
  </div>
</div>

<div class="hazard"></div>

<script>
(function(){
"use strict";

/* ============================================================
   THINGS YOU MIGHT WANT TO CHANGE
   ============================================================ */
var CONFIG = {
  BRICKS_PER_LEVEL   : 5,      /* correct answers per celebration          */
  NUMBERS_UP_TO      : 10,     /* highest numeral shown                    */
  COUNTING_ROUNDS    : true,   /* mix "how many?" rounds into numbers      */
  COUNT_MAX          : 6,      /* biggest quantity a counting round asks   */
  LETTER_SOUND_ROUNDS: true,   /* mix "which letter says buh?" rounds in   */
  SOUND_ROUND_SHARE  : 0.30,   /* how often, when sound rounds are on      */
  LETTER_CASE        : "mixed",/* "upper" | "lower" | "mixed"              */
  LOWERCASE_SHARE    : 0.35,   /* share of lowercase rounds when mixed     */
  ADAPTIVE           : true,   /* practise missed items more often         */
  BASE_CHOICES       : 3,      /* normal number of options — never fewer   */
  MAX_CHOICES        : 4,      /* options once an item is solid            */
  SAVE_PROGRESS      : true,   /* remember progress between sessions       */
  PREFERRED_VOICE_NAME: ""     /* force one exact voice by name            */
};

/* Gap after naming a wrong choice, before the question is asked again.
   Speech engines mostly ignore punctuation for pausing, so the two halves
   are spoken as separate utterances with a real timed silence between. */
var CORRECTION_GAP_MS = 750;
var PRAISE_GAP_MS     = 320;
var MIN_LOCK_MS       = 1000;

/* ============================================================
   GLYPH SAFETY
   Emoji added in Unicode 13+ (bucket, log, pickup truck) are missing on
   plenty of devices and render as an empty box. Everything below is drawn
   once to a canvas and compared against a known-unrenderable character;
   anything that matches is dropped before the child ever sees it.
   ============================================================ */
var glyphOk = (function(){
  try{
    var c = document.createElement("canvas");
    c.width = 44; c.height = 44;
    var ctx = c.getContext && c.getContext("2d");
    if(!ctx) return function(){ return true; };
    ctx.textBaseline = "top";
    ctx.font = "30px sans-serif";
    function snap(s){
      ctx.clearRect(0,0,44,44);
      ctx.fillText(s, 2, 2);
      return c.toDataURL();
    }
    var blank = snap("");
    var tofu  = snap("􏿿");    /* U+10FFFF — never has a glyph */
    var cache = {};
    return function(ch){
      if(cache.hasOwnProperty(ch)) return cache[ch];
      var img = snap(ch);
      var ok = (img !== blank && img !== tofu);
      cache[ch] = ok;
      return ok;
    };
  }catch(e){
    return function(){ return true; };
  }
})();

function safeEmo(ch, fallback){ return glyphOk(ch) ? ch : fallback; }
function filterEmo(list, fallback){
  var out = [], i;
  for(i=0;i<list.length;i++){ if(glyphOk(list[i].emo)) out.push(list[i]); }
  return out.length ? out : fallback;
}

/* ============================================================
   DATA
   ============================================================ */
var COLORS = [
  {name:"RED",    say:"red",    hex:"#e03131", text:"#fff"},
  {name:"BLUE",   say:"blue",   hex:"#1c7ed6", text:"#fff"},
  {name:"YELLOW", say:"yellow", hex:"#fcc419", text:"#3b2f00"},
  {name:"GREEN",  say:"green",  hex:"#2f9e44", text:"#fff"},
  {name:"ORANGE", say:"orange", hex:"#f76707", text:"#fff"},
  {name:"PURPLE", say:"purple", hex:"#8e44ad", text:"#fff"},
  {name:"PINK",   say:"pink",   hex:"#f06595", text:"#fff"},
  {name:"BROWN",  say:"brown",  hex:"#8b5a2b", text:"#fff"}
];

/* deliberately old, widely-shipped emoji — nothing newer than Unicode 11 */
var VEHICLES = filterEmo([
  {emo:"🚚",  say:"truck"},
  {emo:"🚜",  say:"digger"},
  {emo:"🏗️", say:"crane"},
  {emo:"🚛",  say:"big truck"},
  {emo:"🚧",  say:"barrier"},
  {emo:"⛑️", say:"helmet"},
  {emo:"🔨",  say:"hammer"},
  {emo:"🔧",  say:"wrench"}
], [{emo:"🚧", say:"barrier"}]);

var COUNTABLES = filterEmo([
  {emo:"🚧",  say:"barriers", one:"barrier"},
  {emo:"⛑️", say:"helmets",  one:"helmet"},
  {emo:"🔨",  say:"hammers",  one:"hammer"},
  {emo:"🔩",  say:"bolts",    one:"bolt"},
  {emo:"⚙️", say:"gears",    one:"gear"},
  {emo:"🔧",  say:"wrenches", one:"wrench"},
  {emo:"🚚",  say:"trucks",   one:"truck"},
  {emo:"🧱",  say:"bricks",   one:"brick"}
], [{emo:"🚧", say:"barriers", one:"barrier"}]);

var SIGN_CAPS = [
  safeEmo("🚧","•"), safeEmo("⛑️","•"), safeEmo("🔨","•"), safeEmo("🔧","•")
];
var SIGN_COLORS = ["#fcc419","#ffa94d","#ffd43b","#f8f0d8","#ffe066"];

var UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
var LOWER = "abcdefghijklmnopqrstuvwxyz".split("");

/* letters that get confused at a glance, per case */
var LOOK_UPPER = [["E","F"],["M","N"],["M","W"],["O","Q"],["P","R"],["V","W"],
                  ["I","T"],["C","G"],["U","V"],["B","D"],["I","L"],["O","D"]];
var LOOK_LOWER = [["b","d"],["p","q"],["b","p"],["d","q"],["n","u"],["m","n"],
                  ["m","w"],["i","l"],["i","j"],["l","j"],["a","o"],["c","e"],
                  ["g","q"],["h","n"],["v","w"],["f","t"],["v","y"],["c","o"]];

   Storage can legitimately be unavailable: Safari private browsing throws
   on write, some embedded viewers block it outright. Every access is
   wrapped, and if it fails the game carries on exactly as before with
   progress that lasts only for the session. The panel says which of the
   two you are getting rather than quietly pretending it saved.

var STORE_KEY = "constructionCrew.progress.v1";
var store = (function(){
  if(!CONFIG.SAVE_PROGRESS) return null;

var stats = {};

function modeStats(m){
  if(!stats[m]) stats[m] = {items:{}, rounds:0, firstTry:0, chanceSum:0, answers:0};
  return stats[m];
}
function itemStats(m, key){
  var ms = modeStats(m);
  if(!ms.items[key]) ms.items[key] = {seen:0, right:0, wrong:0, streak:0, lastRound:-99};
  return ms.items[key];
}
function todayKey(){
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function dayRec(){
  var k = todayKey();

function num(v, dflt){ return (typeof v === "number" && isFinite(v)) ? v : dflt; }
function normalise(){
  var m, k;
  for(m in stats){
    if(!stats.hasOwnProperty(m)) continue;
    var ms = stats[m];
    if(!ms || typeof ms !== "object"){ delete stats[m]; continue; }
    ms.rounds    = num(ms.rounds,0);
    ms.firstTry  = num(ms.firstTry,0);
    ms.chanceSum = num(ms.chanceSum,0);
    ms.answers   = num(ms.answers,0);
    if(!ms.items || typeof ms.items !== "object") ms.items = {};
    for(k in ms.items){
      if(!ms.items.hasOwnProperty(k)) continue;
      var it = ms.items[k];
      if(!it || typeof it !== "object"){ delete ms.items[k]; continue; }
      it.seen  = num(it.seen,0);  it.right = num(it.right,0);
      it.wrong = num(it.wrong,0); it.streak = num(it.streak,0);
      /* a saved round number means nothing in the new session — treat every
         item as "not seen recently" so the spacing rule starts clean */
      it.lastRound = -99;
    }
  }
  for(k in days){
    if(!days.hasOwnProperty(k)) continue;
    if(!days[k] || typeof days[k] !== "object"){ delete days[k]; continue; }
    days[k].rounds   = num(days[k].rounds,0);
    days[k].firstTry = num(days[k].firstTry,0);

    if(!data || data.v !== 1) return;          /* future format — ignore, don't crash */
    if(data.stats && typeof data.stats === "object") stats = data.stats;
    if(data.days  && typeof data.days  === "object") days  = data.days;

var pending = [];
function later(fn, ms){
  var id = setTimeout(function(){
    var i = pending.indexOf(id); if(i>-1) pending.splice(i,1);
    fn();
  }, ms);

}

function rnd(n){ return Math.floor(Math.random()*n); }

function shuffle(a){
  var i,j,t;
  for(i=a.length-1;i>0;i--){ j=rnd(i+1); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function looksAlike(a,b,table){
  for(var i=0;i<table.length;i++){
    var p=table[i];
    if((p[0]===a&&p[1]===b)||(p[1]===a&&p[0]===b)) return true;
  }
  return false;
}
function numWord(n){

function tone(freq,start,dur,type,vol){

    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}

/* every phrase the game intends to speak, so wording can be checked
   automatically on machines with no speech engine installed */
var spokenLog = [];
function say(text, onDone){
  spokenLog.push(text);
  if(spokenLog.length > 400) spokenLog.splice(0,150);
  function finish(ok){ if(onDone){ var f=onDone; onDone=null; f(ok); } }
  if(state.muted || !speechOK){ finish(false); return; }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = bestVoice(); if(v) u.voice=v;
    u.rate  = 0.82;
    u.pitch = 1.25;
    u.volume = 1;
    u.onend   = function(){ finish(true); };
    u.onerror = function(){ finish(false); };
    window.speechSynthesis.speak(u);
  }catch(e){ finish(false); }
}

/* Speak a list of [{text, gap}] as SEPARATE utterances with real silence
   between them. Punctuation alone does not produce a reliable pause in any
   engine I can depend on, and "That's D. Find R." ran together as one
   breath — unusable for a 4-year-old. */
/* Every spoken chain is stamped with the generation it started in. Moving to
   a new round bumps the generation, which strands any half-finished chain
   instead of letting it wake up later and interleave with the new one —
   an utterance whose "end" event arrives late (common when a cancel() from
   somewhere else finally flushes it) would otherwise resume mid-count and
   the child hears two sequences braided together. */
var speechGen = 0;
function bumpSpeech(){
  speechGen++;
  try{ if(speechOK) window.speechSynthesis.cancel(); }catch(e){}
}
function saySeq(parts, onDone){
  var g = speechGen, i = 0;
  function step(){
    if(g !== speechGen) return;
    if(i >= parts.length){ if(onDone) onDone(); return; }
    var p = parts[i++];
    say(p.text, function(){
      if(g !== speechGen) return;
      if(p.gap) later(step, p.gap);
      else step();
    });
  }
  step();
}
function estimate(parts){
  var t = 0;
  for(var i=0;i<parts.length;i++){
    t += Math.max(550, 380 + parts[i].text.length*78) + (parts[i].gap||0);
  }
  return t;
}

/* Speak, holding the board until it finishes. Three guards, because
   speechSynthesis end events are unreliable on some mobile browsers:
   a hard floor so there is always a pause, the end events themselves,
   and a ceiling so a missing event can never freeze the game. */
function holdAndSay(parts, minMs, whenDone){
  state.locked = true;
  choicesEl.classList.add("waiting");
  var t0 = Date.now(), released = false, ceiling = null;
  function release(){
    if(released) return;
    released = true;
    if(ceiling) clearTimeout(ceiling);
    state.locked = false;
    choicesEl.classList.remove("waiting");
    if(whenDone) whenDone();
  }
  ceiling = setTimeout(release, estimate(parts) + 2000);
  saySeq(parts, function(){
    var waited = Date.now() - t0;
    setTimeout(release, Math.max(0, (minMs||MIN_LOCK_MS) - waited) + 200);
  });
  state.releaseLock = release;
}

/* ============================================================
   ADAPTIVE SELECTION
   Uniform random means a letter he nailed ten times keeps reappearing
   while one he has never got right shows up just as rarely. Weighting by
   recent performance concentrates practice where it is actually needed.
   ============================================================ */
function itemWeight(st, roundNo){
  if(!st || st.seen===0) return 3.5;              /* never seen — introduce it */
  var w = 1;
  w += 2.5 * Math.min(st.wrong, 4);               /* missed items come back    */
  w -= 0.45 * Math.min(st.streak, 4);             /* mastered ones fade        */
  if(st.streak >= 4) w *= 0.35;                   /* solid — occasional review */
  var since = roundNo - st.lastRound;
  if(since < 3) w *= 0.25;                        /* spacing, don't hammer     */
  return Math.max(0.15, w);
}
function chooseTarget(mode, pool, avoid){
  if(!CONFIG.ADAPTIVE){
    var p2 = (pool.length>3 && avoid) ? pool.filter(function(k){return k!==avoid;}) : pool;
    return pick(p2);
  }
  var ms = modeStats(mode), weights=[], total=0, i;
  for(i=0;i<pool.length;i++){
    var w = (pool[i]===avoid && pool.length>3) ? 0 : itemWeight(ms.items[pool[i]], ms.rounds);
    weights.push(w); total += w;
  }
  if(total<=0) return pick(pool);
  var r = Math.random()*total, acc=0;
  for(i=0;i<pool.length;i++){
    acc += weights[i];
    if(r <= acc) return pool[i];
  }
  return pool[pool.length-1];
}
/* Three options is the floor for every normal round; an item he has got
   right several times running steps up to four, which also means a correct
   answer there carries more information. The only time he ever sees two is
   the helper below, after he has already missed the same item twice. */
function choiceCountFor(mode, key, poolSize){
  var n = CONFIG.BASE_CHOICES;
  if(CONFIG.ADAPTIVE){
    var st = modeStats(mode).items[key];
    if(st && st.seen > 0 && st.streak >= 3 && st.wrong <= st.right) n = CONFIG.MAX_CHOICES;
  }
  return Math.max(CONFIG.BASE_CHOICES, Math.min(n, poolSize));
}
function pickDistractors(pool, target, howMany, lookTable){
  var others=[], guard=0;
  while(others.length<howMany && guard<800){
    guard++;
    var cand = pick(pool);
    if(cand===target || others.indexOf(cand)>-1) continue;
    if(lookTable && looksAlike(cand,target,lookTable)) continue;
    var clash=false;
    for(var i=0;i<others.length;i++){
      if(lookTable && looksAlike(cand,others[i],lookTable)) clash=true;
    }
    if(clash) continue;
    others.push(cand);
  }
  while(others.length<howMany){                    /* safety net */
    var f=pick(pool);
    if(f!==target && others.indexOf(f)===-1) others.push(f);
    else if(pool.length <= howMany+1) break;
  }
  return others;
}

/* ---------- COLORS ---------- */
function buildColorRound(){
  var pool = COLORS.map(function(c){ return c.name; });
  var targetName = chooseTarget("colors", pool, state.lastTarget);
  var target = null, i;
  for(i=0;i<COLORS.length;i++) if(COLORS[i].name===targetName) target=COLORS[i];
  state.lastTarget = targetName;
  state.target = targetName;

  var n = choiceCountFor("colors", targetName, pool.length);
  var set = shuffle([targetName].concat(pickDistractors(pool, targetName, n-1, null)));
  var veh = pick(VEHICLES);

  promptEl.innerHTML = 'Find the <span class="target" style="background:'+target.hex+
                       ';color:'+target.text+'">'+target.name+'</span> '+veh.say.toUpperCase()+'!';
  state.sayParts   = [{text:"Find the " + target.say + " " + veh.say}];
  state.retryParts = [{text:"Find the " + target.say + " " + veh.say}];
  state.successLabel = target.say + " " + veh.say;
  state.labelFor = function(val){
    for(var k=0;k<COLORS.length;k++) if(COLORS[k].name===val) return COLORS[k].say;
    return String(val).toLowerCase();
  };

  renderTiles(set, {
    bg: function(v){ for(var k=0;k<COLORS.length;k++) if(COLORS[k].name===v) return COLORS[k].hex; return "#ccc"; },
    label: function(v){ return v; },
    inner: function(){ return '<span class="emo">'+veh.emo+'</span>'; }
  });
  saySeq(state.sayParts);
}

/* ---------- LETTERS ---------- */
function currentCase(){
  if(CONFIG.LETTER_CASE === "lower") return "lower";
  if(CONFIG.LETTER_CASE === "upper") return "upper";
  return (Math.random() < CONFIG.LOWERCASE_SHARE) ? "lower" : "upper";
}
function buildLetterRound(){
  var lower = currentCase() === "lower";
  var pool  = lower ? LOWER : UPPER;
  var table = lower ? LOOK_LOWER : LOOK_UPPER;

  var target = chooseTarget("letters", pool, state.lastTarget);
  state.lastTarget = target;
  state.target = target;

  var n = choiceCountFor("letters", target, pool.length);
  var set = shuffle([target].concat(pickDistractors(pool, target, n-1, table)));

  var upperKey = target.toUpperCase();
  var soundable = CONFIG.LETTER_SOUND_ROUNDS && speechOK && !state.muted &&
                  LETTER_SOUND[upperKey] && Math.random() < CONFIG.SOUND_ROUND_SHARE;

  if(soundable){
    /* A sound round must NOT show the letter, or it collapses into simple
       shape-matching. The child hears the sound and finds the symbol. */
    state.roundType = "sound";
    var info = LETTER_SOUND[upperKey];
    var ask = info.sound
      ? "Which letter says " + info.sound + "? Like in " + info.word + "."
      : "Which letter starts " + info.word + "?";
    promptEl.innerHTML = safeEmo("🔊","♪") + ' Listen — which letter?';
    state.sayParts   = [{text:ask}];
    state.retryParts = [{text:ask}];
    state.successLabel = target + (info.sound ? ". " + info.sound : "");
  } else {
    promptEl.innerHTML = 'Find the letter <span class="target">'+target+'</span>';
    state.sayParts   = [{text:"Find the letter " + target}];
    state.retryParts = [{text:"Find " + target}];
    state.successLabel = target;
  }
  state.labelFor = function(val){ return String(val); };

  renderTiles(set, {
    bg: function(v,i){ return SIGN_COLORS[i%SIGN_COLORS.length]; },
    label: function(v){ return "Letter "+v; },
    inner: function(v,i){
      var cap = SIGN_CAPS[i%SIGN_CAPS.length];
      return '<span class="cap">'+cap+'</span><span class="letter">'+v+'</span>';
    }
  });
  saySeq(state.sayParts);
}

/* ---------- NUMBERS ---------- */
function buildNumberRound(){
  var all=[], i;
  for(i=1;i<=CONFIG.NUMBERS_UP_TO;i++) all.push(String(i));

  var counting = CONFIG.COUNTING_ROUNDS && Math.random() < 0.34;

  if(counting){
    var maxN = Math.min(CONFIG.COUNT_MAX, CONFIG.NUMBERS_UP_TO);
    var countPool=[];
    for(i=1;i<=maxN;i++) countPool.push(String(i));

    var target = chooseTarget("numbers", countPool, state.lastTarget);
    state.lastTarget = target;
    state.target = target;
    state.roundType = "count";

    var thing = pick(COUNTABLES);
    state.countThing = thing;
    drawCount(parseInt(target,10), thing.emo);

    promptEl.innerHTML = 'How many '+thing.say.toUpperCase()+'?';
    state.sayParts   = [{text:"How many " + thing.say + "?"}];
    state.retryParts = [{text:"Let's count again."}, {text:"How many " + thing.say + "?"}];
    state.successLabel = numWord(target) + " " +
                         (parseInt(target,10)===1 ? (thing.one||thing.say) : thing.say);
    state.labelFor = function(val){ return numWord(val); };

    var nc = choiceCountFor("numbers", target, all.length);
    renderTiles(shuffle([target].concat(pickDistractors(all, target, nc-1, LOOK_NUM))), {
      bg: function(v,i){ return SIGN_COLORS[i%SIGN_COLORS.length]; },
      label: function(v){ return "Number "+v; },
      inner: function(v,i){
        var two = String(v).length>1 ? " two" : "";
        return '<span class="cap">'+SIGN_CAPS[i%SIGN_CAPS.length]+'</span>'+
               '<span class="letter'+two+'">'+v+'</span>';
      }
    });
    saySeq(state.sayParts);
    return;
  }

  var t = chooseTarget("numbers", all, state.lastTarget);
  state.lastTarget = t;
  state.target = t;

  promptEl.innerHTML = 'Find the number <span class="target">'+t+'</span>';
  state.sayParts   = [{text:"Find the number " + numWord(t)}];
  state.retryParts = [{text:"Find " + numWord(t)}];
  state.successLabel = numWord(t);
  state.labelFor = function(val){ return numWord(val); };

  var n2 = choiceCountFor("numbers", t, all.length);
  renderTiles(shuffle([t].concat(pickDistractors(all, t, n2-1, LOOK_NUM))), {
    bg: function(v,i){ return SIGN_COLORS[i%SIGN_COLORS.length]; },
    label: function(v){ return "Number "+v; },
    inner: function(v,i){
      var two = String(v).length>1 ? " two" : "";
      return '<span class="cap">'+SIGN_CAPS[i%SIGN_CAPS.length]+'</span>'+
             '<span class="letter'+two+'">'+v+'</span>';
    }
  });
  saySeq(state.sayParts);
}

/* Three arrangements. A plain row pushes one-by-one counting; dice patterns
   build instant recognition of small quantities; the ten-frame shows why
   six is "five and one more". */
var DICE = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawCount(n, emo){
  countBox.innerHTML = "";
  state.countCells = [];
  var kinds = ["row","frame"];
  if(DICE[n]) kinds.push("dice");
  var kind = pick(kinds);
  countBox.className = kind + " on";

  var i, cell;
  if(kind === "dice"){
    var spots = DICE[n];
    for(i=0;i<9;i++){
      cell = document.createElement("div");
      cell.className = "cell" + (spots.indexOf(i)>-1 ? "" : " empty");
      if(spots.indexOf(i)>-1){ cell.textContent = emo; state.countCells.push(cell); }
      else cell.innerHTML = "&nbsp;";
      countBox.appendChild(cell);
    }
  } else if(kind === "frame"){
    for(i=0;i<10;i++){
      cell = document.createElement("div");
      cell.className = "cell" + (i<n ? "" : " empty");
      if(i<n){ cell.textContent = emo; state.countCells.push(cell); }
      else cell.innerHTML = "&nbsp;";
      countBox.appendChild(cell);
    }
  } else {
    for(i=0;i<n;i++){
      cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = emo;
      state.countCells.push(cell);
      countBox.appendChild(cell);
    }
  }
}

function repeatPrompt(){
  if(!state.mode || !state.sayParts.length) return;
  saySeq(state.sayParts);
}

/* ============================================================
   ANSWERS
   ============================================================ */
function onPick(ev){
  if(state.locked) return;
  var btn = ev.currentTarget;
  var val = btn.dataset.val;
  var ms  = modeStats(state.mode);
  var st  = itemStats(state.mode, state.target);

  if(val !== state.target){
    state.missesThisRound++;
    if(state.missesThisRound === 1){ st.wrong++; st.streak = 0; ms.answers++; saveProgress(); }

    btn.classList.remove("wrong");
    void btn.offsetWidth;
    btn.classList.add("wrong");
    sfxNope();

    /* Naming what he tapped turns the mistake into a second labelled
       exposure — he hears "that's B" while looking straight at a B. The
       pause between that and the re-ask is deliberate; run together they
       are one unintelligible blur at this age. */
    var named = state.labelFor ? state.labelFor(val) : String(val);
    var parts = [{text:"That's " + named + ".", gap:CORRECTION_GAP_MS}]
                  .concat(state.retryParts);

    /* Missed twice on the same item? Quietly take one wrong option away so
       he can finish on a success rather than spiral. */
    var shouldEase = (state.missesThisRound >= 2);
    holdAndSay(parts, MIN_LOCK_MS, function(){
      if(shouldEase) easeOneOption();
    });
    return;
  }

  st.right++; st.streak++;
  ms.answers++;
  var today = dayRec();
  today.rounds++;
  if(state.missesThisRound === 0){ ms.firstTry++; today.firstTry++; }
  saveProgress();

  state.locked = true;
  choicesEl.classList.add("waiting");
  btn.classList.add("right");
  var kids = choicesEl.children;
  for(var i=0;i<kids.length;i++){ if(kids[i]!==btn) kids[i].classList.add("fade"); }

  sfxGood();
  state.stars++; state.bricks++;
  renderScore(); renderSite(true);
  confetti(14);

  var myGen = speechGen, advanced = false;
  function advance(){
    if(advanced || myGen !== speechGen) return;
    advanced = true;
    clearTimeout(hardStop);
    choicesEl.classList.remove("waiting");
    if(state.bricks >= CONFIG.BRICKS_PER_LEVEL) later(levelUp, 250);
    else later(newRound, 350);
  }

  /* Praise, a beat, then the answer named again — one more free pairing of
     the symbol with its name at the moment he is most receptive. In a
     counting round the naming is left to countAloud, which ends on the
     total, so it isn't said twice. */
  var counting = (state.roundType === "count");
  var seq = counting
    ? [{text:nextPraise(), gap:PRAISE_GAP_MS}, {text:"Let's count them."}]
    : [{text:nextPraise(), gap:PRAISE_GAP_MS}, {text:state.successLabel + "."}];

  var budget = estimate(seq) + (counting ? state.countCells.length*1300 + 3000 : 0) + 6000;
  var hardStop = setTimeout(advance, budget);

  saySeq(seq, function(){
    if(counting) countAloud(function(){ later(advance, 400); });
    else later(advance, 550);
  });
}

/* fade out one wrong option, leaving a 50/50 he can win */
function easeOneOption(){
  var kids = choicesEl.children, live = [];
  for(var i=0;i<kids.length;i++){
    if(kids[i].dataset.val !== state.target && !kids[i].classList.contains("gone")) live.push(kids[i]);
  }
  if(live.length <= 1) return;          /* already down to a straight choice */
  pick(live).classList.add("gone");
}

/* "one… two… three… three bolts!" — counting each object aloud while it
   lights up is what teaches that the LAST number said is how many there
   are. Plenty of 4-year-olds can recite to twenty without knowing that. */
function countAloud(done){
  var g = speechGen;
  var cells = state.countCells, n = cells.length, i = 0;
  var ct = state.countThing;
  if(!n){ if(done) done(); return; }
  function step(){
    if(g !== speechGen) return;
    if(i >= n){
      /* the last number said IS how many there are — that is the whole point */
      var noun = ct ? (n===1 ? (ct.one || ct.say) : ct.say) : "";
      say(numWord(n) + " " + noun + "!", function(){
        if(g !== speechGen) return;
        later(function(){ if(done) done(); }, 200);
      });
      return;
    }
    var cell = cells[i];
    if(cell){ cell.classList.add("tick","counted"); }
    sfxTick();
    (function(c){ later(function(){ if(c) c.classList.remove("tick"); }, 260); })(cell);
    i++;
    say(numWord(i), function(){
      if(g !== speechGen) return;
      later(step, 220);
    });
  }
  step();
}

var praiseBag = [], lastPraise = "";
function nextPraise(){
  if(!praiseBag.length) praiseBag = shuffle(PRAISE.slice());
  var p = praiseBag.pop();
  if(p === lastPraise && praiseBag.length){ var q = praiseBag.pop(); praiseBag.push(p); p = q; }
  lastPraise = p;
  return p;
}

/* ============================================================
   CELEBRATION
   ============================================================ */
function levelUp(){
  state.bricks = 0;
  state.levelsDone++;
  var tier = TIERS[(state.levelsDone - 1) % TIERS.length];

  cheerEmo.textContent = pick(tier.emo);
  cheerText.textContent = pick(tier.text);

  towerEl.innerHTML = "";
  towerEl.classList.remove("on");
  if(tier.floors > 0){
    for(var i=0;i<tier.floors;i++){
      var f=document.createElement("div");
      f.className = "floor" + (i===tier.floors-1 ? " cap" : "");
      f.style.animationDelay = (0.10 + i*0.13) + "s";
      towerEl.appendChild(f);
    }
    if(tier.top){
      var t=document.createElement("div");
      t.id="towerTop"; t.textContent=tier.top;
      t.style.animationDelay = (0.10 + tier.floors*0.13) + "s";
      towerEl.appendChild(t);
    }
    towerEl.classList.add("on");
  }

  cheerEl.classList.add("on");
  sfxLevel(state.levelsDone % TIERS.length === 0 ? 3 : (tier.floors ? 2 : 1));
  confetti(tier.confetti);

  truckEl.classList.remove("go"); void truckEl.offsetWidth; truckEl.classList.add("go");
  if(tier.trucks > 1){
    truck2El.classList.remove("go"); void truck2El.offsetWidth; truck2El.classList.add("go");
  }
  if(tier.fireworks) fireworks();

  saySeq([{text:pick(tier.line)}]);

  later(function(){
    cheerEl.classList.remove("on");
    towerEl.classList.remove("on");
    towerEl.innerHTML = "";
    truckEl.classList.remove("go");
    truck2El.classList.remove("go");
    newRound();
  }, tier.dur);
}

function fireworks(){
  var w = stage.clientWidth || window.innerWidth;
  var h = stage.clientHeight || window.innerHeight;
  var glyph = [safeEmo("🎆",""), safeEmo("✨",""), safeEmo("🎇","")].filter(Boolean);
  if(!glyph.length) return;
  var spots = [[0.10,0.16],[0.86,0.13],[0.50,0.05],[0.16,0.40],[0.82,0.36]];
  spots.forEach(function(p,i){
    later(function(){
      var d=document.createElement("div");
      d.className="firework";
      d.textContent = pick(glyph);
      d.style.left = Math.round(w*p[0]) + "px";
      d.style.top  = Math.round(h*p[1]) + "px";
      stage.appendChild(d);
      setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 1700);
    }, i*260);
  });
}

var CONF_COLORS=["#e03131","#1c7ed6","#fcc419","#2f9e44","#f76707","#8e44ad","#f06595","#ffffff"];
function confetti(n){
  var w = stage.clientWidth || window.innerWidth;
  for(var i=0;i<n;i++){
    (function(){
      var d=document.createElement("div");
      d.className="confetti";
      d.style.background = pick(CONF_COLORS);
      d.style.left = rnd(w) + "px";
      d.style.transform = "rotate("+rnd(360)+"deg)";
      stage.appendChild(d);
      var dur = 1400 + rnd(1200);
      var drift = (rnd(140)-70);
      try{
        var anim = d.animate([
          {transform:"translate(0,0) rotate(0deg)", opacity:1},
          {transform:"translate("+drift+"px,"+(stage.clientHeight+80)+"px) rotate("+(360+rnd(540))+"deg)", opacity:.9}
        ], {duration:dur, easing:"cubic-bezier(.3,.6,.6,1)"});
        anim.onfinish = function(){ if(d.parentNode) d.parentNode.removeChild(d); };
      }catch(e){}
      setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, dur+400);
    })();
  }
}

/* ============================================================
   PROGRESS PANEL
   ============================================================ */
var MODE_LABEL = {colors:"🎨 Colors", letters:"🔤 Letters", numbers:"🔢 Numbers"};
var DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function prettyDay(key){
  var bits = key.split("-");
  var d = new Date(+bits[0], +bits[1]-1, +bits[2]);
  if(isNaN(d.getTime())) return key;
  if(key === todayKey()) return "Today";
  return DAY_NAMES[d.getDay()] + " " + (+bits[2]) + "/" + (+bits[1]);
}
function renderProgress(){
  var modes = ["colors","letters","numbers"], html = "", any = false;

  /* today first — it's the question a parent actually has */
  var t = days[todayKey()];
  if(t && t.rounds){
    html += '<div class="pcard"><h3>Today</h3><div class="pline">'+
            t.rounds+' rounds · <b>'+Math.round(100*t.firstTry/t.rounds)+'% right first try</b></div></div>';
  }

  var recent = Object.keys(days).sort().reverse().filter(function(k){ return days[k].rounds>0; }).slice(0,7);
  if(recent.length > 1){
    html += '<div class="pcard"><h3>Recent days</h3>';
    recent.forEach(function(k){
      var d = days[k];
      html += '<div class="pline">'+prettyDay(k)+' — '+d.rounds+' rounds · '+
              Math.round(100*d.firstTry/d.rounds)+'%</div>';
    });
    html += '</div>';
  }

  modes.forEach(function(m){
    var ms = stats[m];
    if(!ms || !ms.answers) return;
    any = true;
    var pct    = Math.round(100 * ms.firstTry / ms.rounds);
    var chance = Math.round(100 * ms.chanceSum / ms.rounds);

    var missed = [], solid = [], k;
    for(k in ms.items){
      if(!ms.items.hasOwnProperty(k)) continue;
      var it = ms.items[k];
      if(it.wrong > 0) missed.push({k:k, n:it.wrong});
      else if(it.right >= 2) solid.push(k);
    }
    missed.sort(function(a,b){ return b.n - a.n; });

    html += '<div class="pcard"><h3>'+MODE_LABEL[m]+' — all time</h3>';
    html += '<div class="pline">'+ms.rounds+' rounds · <b>'+pct+'% right first try</b></div>';
    html += '<div class="bar"><i style="width:'+Math.max(2,pct)+'%"></i>'+
            '<b style="left:'+chance+'%"></b></div>';
    html += '<div class="pline" style="opacity:.7">The yellow mark is ~'+chance+
            '% — what pure guessing would score, given how many options were on screen. '+
            'Only the gap above that mark is real learning.</div>';
    if(missed.length){
      html += '<div class="pline" style="margin-top:9px">Tripped him up:</div><div>';
      missed.slice(0,14).forEach(function(x){
        html += '<span class="chip">'+x.k+' ×'+x.n+'</span>';
      });
      html += '</div>';
    } else {
      html += '<div class="pline" style="margin-top:9px">No misses at all this session.</div>';
    }
    if(solid.length){
      html += '<div class="pline" style="margin-top:9px">Solid:</div><div>';
      solid.slice(0,20).forEach(function(k2){ html += '<span class="chip ok">'+k2+'</span>'; });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '<div class="pcard"><h3>Start fresh</h3>'+
          '<div class="pline">Wipes every number above and starts him from scratch.</div>'+
          '<button id="resetBtn" class="minibtn" style="margin-top:9px;background:#c0392b;color:#fff">Erase all progress</button>'+
          '</div>';

  progBody.innerHTML = any ? html :
    '<div class="pcard"><div class="pline">Nothing played yet. '+
    'Play a round or two and the numbers will show up here.</div></div>' + html;

  progSub.textContent = store
    ? "Saved on this device, in this browser. Private/incognito windows and a different browser each keep their own separate record."
    : "This browser will not let the game save anything, so these numbers cover this session only and will be gone when the page reloads.";

  var rb = document.getElementById("resetBtn");
  if(rb){
    var armed = false;
    rb.addEventListener("click", function(){
      if(!armed){
        armed = true;
        rb.textContent = "Tap again to erase";
        setTimeout(function(){ if(armed){ armed=false; rb.textContent="Erase all progress"; } }, 4000);
        return;
      }
      resetProgress();
      renderProgress();
    });
  }
}

/* ---- test hooks ---- */
window.__game = {
  state: state,
  config: CONFIG,
  stats: function(){ return stats; },
  pickVoiceFrom: pickVoiceFrom,
  voiceScore: voiceScore,
  currentVoiceName: function(){ var v=bestVoice(); return v? v.name : null; },
  countShown: function(){ return state.countCells.length; },
  countKind: function(){ return countBox.className.replace(" on","").trim(); },
  spokenLog: function(){ return spokenLog.slice(); },
  lastSpoken: function(){ return spokenLog[spokenLog.length-1] || null; },
  clearSpoken: function(){ spokenLog.length = 0; },
  isWaiting: function(){ return choicesEl.classList.contains("waiting"); },
  optionCount: function(){ return choicesEl.children.length; },
  liveOptions: function(){
    var out=[], k=choicesEl.children;
    for(var i=0;i<k.length;i++) if(!k[i].classList.contains("gone")) out.push(k[i].dataset.val);
    return out;
  },
  glyphOk: glyphOk,
  days: function(){ return days; },
  chooseTarget: chooseTarget,
  itemWeight: itemWeight,
  choiceCountFor: choiceCountFor,
  storageWorks: function(){ return !!store; },
  storeKey: STORE_KEY,
  saveNow: saveNow,
  resetProgress: function(){ resetProgress(); },
  emojiInUse: function(){
    var out = [];
    VEHICLES.forEach(function(v){ out.push(v.emo); });
    COUNTABLES.forEach(function(v){ out.push(v.emo); });
    SIGN_CAPS.forEach(function(c){ out.push(c); });
    TIERS.forEach(function(t){ t.emo.forEach(function(e){ out.push(e); }); if(t.top) out.push(t.top); });
    return out;
  },
  praisePool: PRAISE,
  tierInfo: function(){ return { levelsDone: state.levelsDone, floors: towerEl.children.length }; },
  renderProgress: renderProgress,
  progressHTML: function(){ return progBody.innerHTML; }
};

})();
</script>
</body>
</html>
