<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5a623">
<title>Construction Crew — Colors, Letters & Numbers</title>
<style>
  :root{
    --hi:#ffcc00;
    --dark:#2b2118;
    --panel:#fff8e7;
    --shadow:0 8px 0 rgba(0,0,0,.22);
    /* one knob controls tile size everywhere */
    --tile:clamp(110px, min(26vw, 34vh), 230px);
  }
  /* tall/narrow screens: 3 tiles side by side would be tiny, so let them
     wrap 2 + 1 and grow instead */
  @media (max-aspect-ratio: 4/5){
    :root{ --tile:min(40vw, 26vh); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:"Trebuchet MS","Verdana",system-ui,-apple-system,sans-serif;
    background:#f5a623;
    background-image:
      repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 28px, rgba(0,0,0,0) 28px 56px);
    color:var(--dark);
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .hazard{height:14px;flex:0 0 14px;
    background:repeating-linear-gradient(45deg,#111 0 18px,#ffcc00 18px 36px);}

  /* ---------- top bar ---------- */
  #bar{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:8px 10px;min-height:56px;
  }
  .iconbtn{
    border:0;background:rgba(0,0,0,.16);color:#fff;
    font-size:22px;line-height:1;border-radius:14px;
    width:52px;height:44px;cursor:pointer;
  }
  .iconbtn:active{transform:translateY(2px);}
  /* home + repeat are meaningless on the menu, so hide them there */
  #bar.atmenu #homeBtn, #bar.atmenu #sayBtn{display:none;}
  #score{
    margin-left:auto;display:flex;gap:4px;align-items:center;
    font-size:clamp(16px,4.4vw,24px);letter-spacing:1px;min-height:30px;
    white-space:nowrap;overflow:hidden;
  }

  /* ---------- screens ---------- */
  #stage{flex:1 1 auto;position:relative;overflow:hidden;}
  .screen{
    position:absolute;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    padding:4px 12px 12px;
  }
  .screen.on{display:flex;}

  /* ---------- menu ---------- */
  #title{
    /* sized so the whole line, emoji included, never wraps */
    font-size:clamp(18px,5.9vw,54px);font-weight:900;color:#fff;
    text-shadow:0 4px 0 rgba(0,0,0,.28);text-align:center;line-height:1.1;
    margin-bottom:4px;white-space:nowrap;
  }
  #subtitle{font-size:clamp(14px,3.4vw,22px);color:#3d2d19;margin-bottom:22px;opacity:.85;}
  .menuwrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;}
  .bigbtn{
    border:0;cursor:pointer;border-radius:28px;
    background:var(--panel);box-shadow:var(--shadow);
    padding:20px 22px;min-width:min(40vw,220px);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    font-family:inherit;color:var(--dark);
  }
  .bigbtn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.22);}
  .bigbtn .ico{font-size:clamp(44px,11vw,80px);line-height:1;}
  .bigbtn .lbl{font-size:clamp(20px,5vw,32px);font-weight:900;letter-spacing:1px;}

  /* ---------- play ---------- */
  #prompt{
    flex:0 0 auto;text-align:center;margin-bottom:10px;
    display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;
  }
  #promptText{
    font-size:clamp(22px,6.2vw,44px);font-weight:900;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  #promptText .target{
    display:inline-block;background:#fff;color:var(--dark);
    padding:2px 16px;border-radius:14px;text-shadow:none;
    box-shadow:0 4px 0 rgba(0,0,0,.22);
  }
  #choices{
    flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;
    gap:clamp(10px,3vw,28px);flex-wrap:wrap;align-content:center;
  }
  .choice{
    border:0;padding:0;cursor:pointer;background:transparent;
    display:flex;align-items:center;justify-content:center;
    width:var(--tile);height:var(--tile);
    border-radius:30px;position:relative;
    box-shadow:0 8px 0 rgba(0,0,0,.25);
    transition:transform .12s ease;
    font-family:inherit;
  }
  .choice:active{transform:translateY(4px) scale(.98);}
  /* the emoji is drained of its own colour so the TILE colour is the only
     colour in play — otherwise a green tractor on a yellow tile teaches
     the wrong thing. */
  .choice .emo{
    font-size:calc(var(--tile) * .52);line-height:1;
    filter:grayscale(1) contrast(.85) brightness(1.35)
           drop-shadow(0 3px 2px rgba(0,0,0,.45));
    opacity:.95;
    pointer-events:none;
  }
  .choice .letter{
    font-size:calc(var(--tile) * .62);font-weight:900;line-height:1;
    color:#1b1b1b;pointer-events:none;
    text-shadow:0 3px 0 rgba(255,255,255,.55);
  }
  /* "10" is two glyphs wide — shrink so it can't crowd the tile edges */
  .choice .letter.two{ font-size:calc(var(--tile) * .42); letter-spacing:-2px; }

  /* row of things to count, shown above the choices in counting rounds */
  #countBox{
    flex:0 0 auto;display:none;flex-wrap:wrap;gap:2px 6px;
    align-items:center;justify-content:center;
    max-width:min(96vw,760px);margin:0 auto 8px;
    background:rgba(255,255,255,.22);border-radius:22px;
    padding:8px 14px;
  }
  #countBox.on{display:flex;}
  #countBox span{
    font-size:clamp(30px,7.5vw,60px);line-height:1.05;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.3));
  }
  .choice .cap{
    position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    font-size:26px;pointer-events:none;
  }
  .choice.wrong{animation:shake .45s;}
  .choice.right{animation:pop .5s;z-index:5;}
  .choice.fade{opacity:.28;transition:opacity .3s;}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-12px) rotate(-4deg)}
    40%{transform:translateX(12px) rotate(4deg)}
    60%{transform:translateX(-8px) rotate(-3deg)}
    80%{transform:translateX(8px) rotate(3deg)}
  }
  @keyframes pop{
    0%{transform:scale(1)}45%{transform:scale(1.22) rotate(-3deg)}100%{transform:scale(1)}
  }

  /* ---------- build progress ---------- */
  #site{
    flex:0 0 auto;height:58px;width:100%;max-width:620px;
    display:flex;align-items:flex-end;justify-content:center;gap:6px;
    margin-top:6px;
  }
  .brick{
    width:44px;height:26px;border-radius:6px;background:rgba(255,255,255,.22);
    border:3px dashed rgba(255,255,255,.4);
  }
  .brick.filled{
    background:#c0392b;border:3px solid #8e2b20;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);
    animation:drop .4s ease-out;
  }
  @keyframes drop{0%{transform:translateY(-60px);opacity:0}100%{transform:none;opacity:1}}

  /* ---------- celebration ---------- */
  #cheer{
    position:absolute;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.45);z-index:20;text-align:center;
  }
  #cheer.on{display:flex;}
  #cheerText{
    font-size:clamp(30px,9vw,68px);font-weight:900;color:#fff;
    text-shadow:0 5px 0 rgba(0,0,0,.35);
  }
  #cheerEmo{
    font-size:clamp(70px,20vw,150px);line-height:1.35;
    margin-bottom:6px;animation:pop .6s;
  }
  .confetti{
    position:absolute;width:14px;height:20px;border-radius:3px;
    top:-30px;z-index:30;pointer-events:none;
  }
  #truck{
    position:absolute;bottom:6px;left:-140px;font-size:clamp(48px,13vw,90px);
    z-index:25;pointer-events:none;display:none;
  }
  #truck.go{display:block;animation:drive 2.6s linear;}
  @keyframes drive{
    from{left:-140px} to{left:110%}
  }
  .hint{
    position:absolute;bottom:8px;left:0;right:0;text-align:center;
    font-size:13px;color:rgba(0,0,0,.45);padding:0 10px;
  }

  /* Short screens — mainly a phone held sideways. Everything has to shrink
     together or the prompt gets clipped behind the top bar and the brick
     row falls off the bottom. */
  @media (max-height: 500px){
    :root{ --tile:min(21vw, 40vh); }
    #bar{ min-height:42px; padding:4px 8px; }
    .iconbtn{ height:36px;width:46px;font-size:19px; }
    #promptText{ font-size:clamp(17px,4.2vw,26px); }
    #prompt{ margin-bottom:4px; }
    #countBox{ padding:4px 10px;margin-bottom:4px;border-radius:16px; }
    #countBox span{ font-size:clamp(19px,4.4vw,32px); }
    #site{ height:24px; }
    .brick{ width:32px;height:13px;border-width:2px; }
    #title{ font-size:clamp(18px,5vw,38px);margin-bottom:0; }
    #subtitle{ margin-bottom:10px; }
    /* menu buttons go icon-beside-label so all three sit on one row */
    .menuwrap{ gap:10px; }
    .bigbtn{ flex-direction:row;gap:10px;padding:10px 16px;min-width:0;border-radius:20px; }
    .bigbtn .ico{ font-size:clamp(24px,5.2vw,34px); }
    .bigbtn .lbl{ font-size:clamp(15px,3.6vw,22px); }
    #voiceBtn{ margin-top:10px; }
    .hint{ display:none; }
  }
  /* grown-up control: cycle the speaking voice. menu only. */
  #voiceBtn{
    margin-top:18px;border:0;cursor:pointer;font-family:inherit;
    background:rgba(0,0,0,.14);color:#4a3517;
    border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;
    max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #voiceBtn:active{transform:translateY(2px);}
</style>
</head>
<body>
<div class="hazard"></div>

<div id="bar">
  <button class="iconbtn" id="homeBtn" aria-label="Back to menu" title="Menu">🏠</button>
  <button class="iconbtn" id="sayBtn" aria-label="Say it again" title="Say it again">🔁</button>
  <button class="iconbtn" id="muteBtn" aria-label="Sound on or off" title="Sound">🔊</button>
  <div id="score"></div>
</div>

<div id="stage">

  <!-- MENU -->
  <section class="screen on" id="menuScreen">
    <div id="title">🚧 CONSTRUCTION CREW 🚧</div>
    <div id="subtitle">Pick a job, boss!</div>
    <div class="menuwrap">
      <button class="bigbtn" data-mode="colors">
        <span class="ico">🎨</span><span class="lbl">COLORS</span>
      </button>
      <button class="bigbtn" data-mode="letters">
        <span class="ico">🔤</span><span class="lbl">LETTERS</span>
      </button>
      <button class="bigbtn" data-mode="numbers">
        <span class="ico">🔢</span><span class="lbl">NUMBERS</span>
      </button>
    </div>
    <button id="voiceBtn" title="Change the speaking voice">🗣️ Voice: checking…</button>
    <div class="hint">Tap a button to start · 🔊 turns the voice on and off</div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="playScreen">
    <div id="prompt"><div id="promptText"></div></div>
    <div id="countBox"></div>
    <div id="choices"></div>
    <div id="site"></div>
  </section>

  <div id="cheer">
    <div id="cheerEmo">🎉</div>
    <div id="cheerText">GREAT JOB!</div>
  </div>
  <div id="truck">🚚</div>
</div>

<div class="hazard"></div>

<script>
(function(){
"use strict";

/* ============================================================
   DATA
   ============================================================ */
var COLORS = [
  {name:"RED",    say:"red",    hex:"#e03131", text:"#fff"},
  {name:"BLUE",   say:"blue",   hex:"#1c7ed6", text:"#fff"},
  {name:"YELLOW", say:"yellow", hex:"#fcc419", text:"#3b2f00"},
  {name:"GREEN",  say:"green",  hex:"#2f9e44", text:"#fff"},
  {name:"ORANGE", say:"orange", hex:"#f76707", text:"#fff"},
  {name:"PURPLE", say:"purple", hex:"#8e44ad", text:"#fff"},
  {name:"PINK",   say:"pink",   hex:"#f06595", text:"#fff"},
  {name:"BROWN",  say:"brown",  hex:"#8b5a2b", text:"#fff"}
];

/* emoji drawn on the coloured panels. picked to read well at large size */
var VEHICLES = [
  {emo:"🚚", say:"truck"},
  {emo:"🚜", say:"digger"},
  {emo:"🏗️", say:"crane"},
  {emo:"🛻", say:"pickup truck"},
  {emo:"🚧", say:"barrier"},
  {emo:"⛑️", say:"helmet"},
  {emo:"🔨", say:"hammer"},
  {emo:"🪣", say:"bucket"}
];

/* ---- numbers ----
   NUMBERS_UP_TO: highest numeral shown (1..this). 10 is a sensible ceiling for 4.
   COUNTING_ROUNDS: mixes in "how many cones? tap the number" rounds.
                    set to false for pure numeral recognition only.
   COUNT_MAX: counting rounds never ask for more than this many objects — past
              ~6, counting a scattered row is hard for this age. */
var NUMBERS_UP_TO   = 10;
var COUNTING_ROUNDS = true;
var COUNT_MAX       = 6;

var NUM_WORDS = ["zero","one","two","three","four","five","six","seven","eight",
                 "nine","ten","eleven","twelve","thirteen","fourteen","fifteen",
                 "sixteen","seventeen","eighteen","nineteen","twenty"];

/* small things that are easy to count, one type per round */
var COUNTABLES = [
  {emo:"🚧", say:"barriers"},
  {emo:"⛑️", say:"helmets"},
  {emo:"🧱", say:"bricks"},
  {emo:"🔨", say:"hammers"},
  {emo:"🪵", say:"logs"},
  {emo:"🚚", say:"trucks"},
  {emo:"🪣", say:"buckets"},
  {emo:"🔩", say:"bolts"}
];

var LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
/* letters that look alike in blocky caps — avoid pairing them as distractors */
var LOOKALIKE = [["E","F"],["M","N"],["M","W"],["O","Q"],["P","R"],["V","W"],["I","T"],["C","G"],["U","V"],["B","D"],
/* numerals that trip up new readers: 6/9 are rotations, 1/7 and 3/8 are close */
                 ["6","9"],["1","7"],["3","8"],["2","5"]];

var SIGN_COLORS = ["#fcc419","#ffa94d","#ffd43b","#f8f0d8","#ffe066"];
var CHEERS = ["GREAT JOB!","YOU GOT IT!","NICE WORK!","AWESOME!","WELL DONE!","SUPER!"];
var CHEER_EMO = ["🎉","⭐","🏆","👷","🎊","💪"];

var BRICKS_PER_LEVEL = 5;

/* ============================================================
   STATE
   ============================================================ */
var state = {
  mode:null,           /* "colors" | "letters" | "numbers" */
  roundType:"id",      /* "id" = recognise the symbol, "count" = count objects */
  target:null,
  sayAgain:"",         /* exact phrase the 🔁 button replays */
  bricks:0,
  stars:0,
  locked:false,
  muted:false,
  lastTarget:null
};

/* ============================================================
   DOM
   ============================================================ */
var $ = function(id){ return document.getElementById(id); };
var menuScreen=$("menuScreen"), playScreen=$("playScreen");
var choicesEl=$("choices"), promptEl=$("promptText"), siteEl=$("site"), countBox=$("countBox"),
    scoreEl=$("score"), cheerEl=$("cheer"), cheerText=$("cheerText"),
    cheerEmo=$("cheerEmo"), truckEl=$("truck"), stage=$("stage");

/* ============================================================
   HELPERS
   ============================================================ */
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(arr){ return arr[rnd(arr.length)]; }
function shuffle(a){
  var i,j,t;
  for(i=a.length-1;i>0;i--){ j=rnd(i+1); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function looksAlike(a,b){
  for(var i=0;i<LOOKALIKE.length;i++){
    var p=LOOKALIKE[i];
    if((p[0]===a&&p[1]===b)||(p[1]===a&&p[0]===b)) return true;
  }
  return false;
}

/* ============================================================
   SOUND — Web Audio for chimes, speechSynthesis for the voice.
   Both are standard browser APIs; no files to host.
   ============================================================ */
var actx=null;
function audio(){
  if(actx) return actx;
  var C = window.AudioContext || window.webkitAudioContext;
  if(!C) return null;
  try{ actx = new C(); }catch(e){ actx=null; }
  return actx;
}
function tone(freq,start,dur,type,vol){
  var a=audio(); if(!a||state.muted) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    o.connect(g); g.connect(a.destination);
    var t=a.currentTime+start;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.22,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function sfxGood(){ tone(523.25,0,.18,"triangle",.25); tone(659.25,.10,.18,"triangle",.25); tone(783.99,.20,.3,"triangle",.25); }
function sfxNope(){ tone(196,0,.16,"sawtooth",.12); tone(155,.10,.22,"sawtooth",.12); }
function sfxLevel(){
  var notes=[523.25,659.25,783.99,1046.5];
  for(var i=0;i<notes.length;i++) tone(notes[i],i*0.13,.3,"triangle",.25);
}

var voices=[];
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  try{ voices = window.speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; }
}
if("speechSynthesis" in window){
  loadVoices();
  try{ window.speechSynthesis.onvoiceschanged = loadVoices; }catch(e){}
}
/* ---- picking a FEMALE voice ------------------------------------------------
   Important caveat: the Web Speech API exposes no gender field on a voice.
   SpeechSynthesisVoice only gives name, lang, voiceURI, localService and
   default. So "female" has to be inferred from the voice's NAME, which is a
   heuristic, not a guarantee. Known female voice names across the major
   platforms are listed below; anything explicitly labelled male is pushed
   down. If none of them are present on a device, the code falls back to the
   best English voice available rather than going silent.
   Set PREFERRED_VOICE_NAME to an exact voice name to override all of this. */
var PREFERRED_VOICE_NAME = "";

var FEMALE_VOICE_NAMES = [
  /* Apple (macOS / iOS) */
  "samantha","karen","moira","tessa","fiona","victoria","allison","ava","susan",
  "vicki","kathy","serena","nicky","zoe","siri female","joana","catherine",
  "martha","kate","stephanie","shelley","sandy","grandma",
  /* Microsoft (Windows / Edge) */
  "zira","hazel","eva","aria","jenny","michelle","linda","heera","susanna",
  "catherine","sonia","libby","natasha","clara","emily","olivia","isha","neerja",
  "ana","yan","molly","mia","amber","ashley","cora","elizabeth","monica","sara",
  /* Google (Android / Chrome) */
  "google uk english female","google us english"
];
var MALE_VOICE_NAMES = [
  "alex","daniel","fred","tom","rishi","aaron","arthur","gordon","oliver",
  "junior","ralph","reed","rocko","eddy","grandpa","jamie","liam","lee",
  "david","mark","guy","ryan","james","george","albert","bruce","william",
  "christopher","eric","roger","steffan","brian","thomas","google uk english male"
];

function voiceScore(v){
  var name = (v.name||"").toLowerCase();
  var blob = name + " " + (v.voiceURI||"").toLowerCase();
  var s = 0, i;

  /* English first — the prompts are English */
  var lang = (v.lang||"").toLowerCase().replace("_","-");
  if(lang.indexOf("en")!==0) s -= 500;

  /* explicit labels win. check "female" BEFORE "male", since the word
     "female" contains "male" as a substring. */
  var saysFemale = blob.indexOf("female")>-1 || /\bwoman\b/.test(blob);
  var stripped   = blob.replace(/female/g,"");
  var saysMale   = /male/.test(stripped) || /\bman\b/.test(stripped);
  if(saysFemale)      s += 200;
  else if(saysMale)   s -= 200;

  /* known names, matched as whole words so "ava" doesn't match "available" */
  var tokens = name.split(/[^a-z]+/).filter(Boolean);
  function hasName(list){
    for(var j=0;j<list.length;j++){
      var target = list[j];
      if(target.indexOf(" ")>-1){ if(name.indexOf(target)>-1) return true; }
      else if(tokens.indexOf(target)>-1) return true;
    }
    return false;
  }
  if(hasName(FEMALE_VOICE_NAMES)) s += 100;
  if(hasName(MALE_VOICE_NAMES))   s -= 100;

  /* tie-breakers: on-device voices start faster and work offline */
  if(v.localService) s += 12;
  if(v.default)      s += 4;
  if(lang.indexOf("en-us")===0 || lang.indexOf("en-gb")===0) s += 6;
  return s;
}

/* exported shape so this is testable without a speech engine present */
function pickVoiceFrom(list){
  if(!list || !list.length) return null;
  var i, best=null, bestScore=-1e9;
  if(PREFERRED_VOICE_NAME){
    for(i=0;i<list.length;i++){ if(list[i].name===PREFERRED_VOICE_NAME) return list[i]; }
  }
  for(i=0;i<list.length;i++){
    var sc = voiceScore(list[i]);
    if(sc>bestScore){ bestScore=sc; best=list[i]; }
  }
  return best;
}

/* index into the English voice list, so a grown-up can cycle voices if the
   heuristic guessed wrong on their device */
var voiceOverride = null;
function englishVoices(){
  var out = voices.filter(function(v){
    return (v.lang||"").toLowerCase().indexOf("en")===0;
  });
  return out.length ? out : voices;
}
function bestVoice(){
  if(voiceOverride) return voiceOverride;
  return pickVoiceFrom(voices);
}

function say(text){
  if(state.muted) return;
  if(!("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = bestVoice(); if(v) u.voice=v;
    u.rate  = 0.85;   /* slow, for little ears */
    u.pitch = 1.25;   /* nudged up: helps a neutral engine read as female */
    u.volume = 1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
/* iOS/Safari will not speak unless speech was first started inside a real
   tap handler. This primes it on the very first touch. */
var primed=false;
function primeSpeech(){
  if(primed) return; primed=true;
  var a=audio(); if(a && a.state==="suspended"){ try{ a.resume(); }catch(e){} }
  if(!("speechSynthesis" in window)) return;
  try{
    var u=new SpeechSynthesisUtterance(" ");
    u.volume=0; window.speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener("pointerdown", primeSpeech, {once:true});

/* ============================================================
   SCREENS
   ============================================================ */
function show(el){
  menuScreen.classList.remove("on");
  playScreen.classList.remove("on");
  el.classList.add("on");
  var bar=$("bar");
  if(el===menuScreen) bar.classList.add("atmenu");
  else bar.classList.remove("atmenu");
}
function goMenu(){
  try{ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }catch(e){}
  state.mode=null; state.locked=false;
  show(menuScreen);
  renderScore(); renderSite();
}

/* ============================================================
   SCORE + BUILD SITE
   ============================================================ */
function renderScore(){
  /* past five, one star plus a count reads better than a wall of stars */
  var s="";
  if(state.stars>5){ s = "⭐ ×"+state.stars; }
  else { for(var i=0;i<state.stars;i++) s+="⭐"; }
  scoreEl.textContent = state.mode ? s : "";
}
function renderSite(){
  siteEl.innerHTML="";
  if(!state.mode) return;
  for(var i=0;i<BRICKS_PER_LEVEL;i++){
    var b=document.createElement("div");
    b.className="brick"+(i<state.bricks?" filled":"");
    siteEl.appendChild(b);
  }
}

/* ============================================================
   ROUND BUILDING
   ============================================================ */
function newRound(){
  state.locked=false;
  choicesEl.innerHTML="";
  countBox.innerHTML="";
  countBox.classList.remove("on");
  state.roundType = "id";
  if(state.mode==="colors")      buildColorRound();
  else if(state.mode==="letters") buildLetterRound();
  else                            buildNumberRound();
  renderSite();
  renderScore();
}

/* shared: build three sign-style tiles from a list of labels */
function renderSigns(set, labeller){
  var caps=["🚧","⛑️","🦺"];
  set.forEach(function(val,i){
    var b=document.createElement("button");
    b.className="choice";
    b.style.background=SIGN_COLORS[i%SIGN_COLORS.length];
    b.setAttribute("aria-label", labeller ? labeller(val) : String(val));
    b.dataset.val=val;
    var two = String(val).length>1 ? " two" : "";
    b.innerHTML='<span class="cap">'+caps[i%caps.length]+'</span>'+
                '<span class="letter'+two+'">'+val+'</span>';
    b.addEventListener("click", onPick);
    choicesEl.appendChild(b);
  });
}

/* pick two distractors that aren't the target, aren't each other, and
   aren't visually confusable with either */
function pickDistractors(pool, target){
  var others=[], guard=0;
  while(others.length<2 && guard<600){
    guard++;
    var cand = pick(pool);
    if(cand===target) continue;
    if(others.indexOf(cand)>-1) continue;
    if(looksAlike(cand,target)) continue;
    var clash=false;
    for(var i=0;i<others.length;i++){ if(looksAlike(cand,others[i])) clash=true; }
    if(clash) continue;
    others.push(cand);
  }
  /* safety net if the lookalike filters were too strict for a small pool */
  while(others.length<2){
    var f=pick(pool);
    if(f!==target && others.indexOf(f)===-1) others.push(f);
  }
  return others;
}

function buildNumberRound(){
  var all=[], i;
  for(i=1;i<=NUMBERS_UP_TO;i++) all.push(String(i));

  /* roughly one round in three is a counting round, when enabled */
  var counting = COUNTING_ROUNDS && Math.random() < 0.34;

  if(counting){
    var maxN = Math.min(COUNT_MAX, NUMBERS_UP_TO);
    var countPool=[];
    for(i=1;i<=maxN;i++) countPool.push(String(i));
    var pool = countPool.length>3 && state.lastTarget
      ? countPool.filter(function(n){ return n!==state.lastTarget; })
      : countPool;

    var target = pick(pool);
    state.lastTarget = target;
    state.target = target;
    state.roundType = "count";

    var thing = pick(COUNTABLES);
    countBox.innerHTML="";
    for(i=0;i<parseInt(target,10);i++){
      var s=document.createElement("span");
      s.textContent=thing.emo;
      countBox.appendChild(s);
    }
    countBox.classList.add("on");

    promptEl.innerHTML = 'How many '+thing.say.toUpperCase()+'?';
    state.sayAgain = "How many " + thing.say + "? Tap the number.";
    say(state.sayAgain);

    renderSigns(shuffle([target].concat(pickDistractors(all, target))),
                function(v){ return "Number "+v; });
    return;
  }

  var pool2 = all.length>3 && state.lastTarget
    ? all.filter(function(n){ return n!==state.lastTarget; })
    : all;
  var t = pick(pool2);
  state.lastTarget = t;
  state.target = t;

  promptEl.innerHTML = 'Find the number <span class="target">'+t+'</span>';
  state.sayAgain = "Find the number " + numWord(t);
  say(state.sayAgain);

  renderSigns(shuffle([t].concat(pickDistractors(all, t))),
              function(v){ return "Number "+v; });
}

function numWord(n){
  var i = parseInt(n,10);
  return (NUM_WORDS[i] !== undefined) ? NUM_WORDS[i] : String(n);
}

function buildColorRound(){
  var pool = COLORS.slice();
  /* don't repeat the same target twice in a row */
  if(state.lastTarget && pool.length>3){
    pool = pool.filter(function(c){ return c.name!==state.lastTarget; });
  }
  var target = pick(pool);
  state.lastTarget = target.name;

  var others = COLORS.filter(function(c){ return c.name!==target.name; });
  shuffle(others);
  var set = shuffle([target, others[0], others[1]]);

  /* one vehicle for the whole round, so colour is the only difference */
  var veh = pick(VEHICLES);

  state.target = target.name;
  promptEl.innerHTML = 'Find the <span class="target" style="background:'+target.hex+';color:'+target.text+'">'+target.name+'</span> '+veh.say.toUpperCase()+'!';
  state.sayAgain = "Find the " + target.say + " " + veh.say;
  say(state.sayAgain);

  set.forEach(function(c){
    var b=document.createElement("button");
    b.className="choice";
    b.style.background=c.hex;
    b.setAttribute("aria-label",c.name);
    b.dataset.val=c.name;
    b.innerHTML='<span class="emo">'+veh.emo+'</span>';
    b.addEventListener("click", onPick);
    choicesEl.appendChild(b);
  });
}

function buildLetterRound(){
  var pool = LETTERS.slice();
  if(state.lastTarget) pool = pool.filter(function(l){ return l!==state.lastTarget; });
  var target = pick(pool);
  state.lastTarget = target;
  state.target = target;

  promptEl.innerHTML = 'Find the letter <span class="target">'+target+'</span>';
  state.sayAgain = "Find the letter " + target;
  say(state.sayAgain);

  renderSigns(shuffle([target].concat(pickDistractors(LETTERS, target))),
              function(v){ return "Letter "+v; });
}

function repeatPrompt(){
  if(!state.mode || !state.sayAgain) return;
  say(state.sayAgain);
}

/* ============================================================
   ANSWER HANDLING
   ============================================================ */
function onPick(ev){
  if(state.locked) return;
  var btn = ev.currentTarget;
  var val = btn.dataset.val;

  if(val !== state.target){
    /* wrong: no penalty, no scary feedback — just a wobble and a nudge */
    btn.classList.remove("wrong");
    void btn.offsetWidth;
    btn.classList.add("wrong");
    sfxNope();
    say("Try again");
    return;
  }

  state.locked = true;
  btn.classList.add("right");
  var kids = choicesEl.children;
  for(var i=0;i<kids.length;i++){ if(kids[i]!==btn) kids[i].classList.add("fade"); }

  sfxGood();
  state.stars++;
  state.bricks++;
  renderScore();
  renderSite();
  confetti(14);
  say(pick(["Yes!","Nice work!","You got it!","Great job!"]));

  if(state.bricks >= BRICKS_PER_LEVEL){
    setTimeout(levelUp, 900);
  } else {
    setTimeout(newRound, 1300);
  }
}

function levelUp(){
  state.bricks = 0;
  cheerEmo.textContent = pick(CHEER_EMO);
  cheerText.textContent = pick(CHEERS);
  cheerEl.classList.add("on");
  sfxLevel();
  confetti(40);
  truckEl.classList.remove("go"); void truckEl.offsetWidth; truckEl.classList.add("go");
  say(pick(["You built it! Great job!","Wow! The whole crew is proud!","You finished the building!"]));
  setTimeout(function(){
    cheerEl.classList.remove("on");
    truckEl.classList.remove("go");
    newRound();
  }, 2800);
}

/* ============================================================
   CONFETTI
   ============================================================ */
var CONF_COLORS=["#e03131","#1c7ed6","#fcc419","#2f9e44","#f76707","#8e44ad","#f06595","#ffffff"];
function confetti(n){
  var w = stage.clientWidth || window.innerWidth;
  for(var i=0;i<n;i++){
    (function(){
      var d=document.createElement("div");
      d.className="confetti";
      d.style.background = pick(CONF_COLORS);
      d.style.left = rnd(w) + "px";
      d.style.transform = "rotate("+rnd(360)+"deg)";
      stage.appendChild(d);
      var dur = 1400 + rnd(1200);
      var drift = (rnd(140)-70);
      try{
        var anim = d.animate([
          {transform:"translate(0,0) rotate(0deg)", opacity:1},
          {transform:"translate("+drift+"px,"+(stage.clientHeight+80)+"px) rotate("+(360+rnd(540))+"deg)", opacity:.9}
        ], {duration:dur, easing:"cubic-bezier(.3,.6,.6,1)"});
        anim.onfinish = function(){ if(d.parentNode) d.parentNode.removeChild(d); };
      }catch(e){
        /* Element.animate missing (very old browser): just clean up */
        setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, dur);
      }
      setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, dur+400);
    })();
  }
}

/* ============================================================
   WIRING
   ============================================================ */
Array.prototype.forEach.call(document.querySelectorAll(".bigbtn"), function(b){
  b.addEventListener("click", function(){
    primeSpeech();
    state.mode = b.dataset.mode;
    state.bricks = 0; state.stars = 0; state.lastTarget = null;
    show(playScreen);
    tone(660,0,.15,"triangle",.2);
    setTimeout(newRound, 120);
  });
});

$("homeBtn").addEventListener("click", goMenu);
$("sayBtn").addEventListener("click", function(){ primeSpeech(); repeatPrompt(); });
$("muteBtn").addEventListener("click", function(){
  state.muted = !state.muted;
  this.textContent = state.muted ? "🔇" : "🔊";
  if(state.muted){
    try{ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }catch(e){}
  } else {
    primeSpeech();
    repeatPrompt();
  }
});

/* ---- voice picker (menu only, for grown-ups) ---- */
var voiceBtn = $("voiceBtn");
function shortVoiceName(v){
  if(!v) return "device default";
  return (v.name||"voice").replace(/\s*[-(].*$/,"").slice(0,28);
}
function refreshVoiceBtn(){
  if(!("speechSynthesis" in window)){
    voiceBtn.textContent = "🗣️ No voice on this browser";
    voiceBtn.disabled = true; return;
  }
  if(!voices.length){ voiceBtn.textContent = "🗣️ Voice: device default"; return; }
  voiceBtn.textContent = "🗣️ Voice: " + shortVoiceName(bestVoice()) + "  (tap to change)";
}
voiceBtn.addEventListener("click", function(){
  primeSpeech();
  var list = englishVoices();
  if(!list.length){ say("Hello! I am ready to play."); return; }
  var cur = bestVoice();
  var idx = list.indexOf(cur);
  voiceOverride = list[(idx+1) % list.length];
  refreshVoiceBtn();
  say("Hello! Find the red truck.");
});
refreshVoiceBtn();
if("speechSynthesis" in window){
  /* voices often arrive asynchronously, especially on Chrome */
  try{
    window.speechSynthesis.addEventListener("voiceschanged", function(){
      loadVoices(); refreshVoiceBtn();
    });
  }catch(e){}
  setTimeout(function(){ loadVoices(); refreshVoiceBtn(); }, 600);
}

$("bar").classList.add("atmenu");

/* stop pinch-zoom + double-tap zoom from wrecking the layout mid-game */
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
var lastTouch=0;
document.addEventListener("touchend", function(e){
  var now=Date.now();
  if(now-lastTouch<320) e.preventDefault();
  lastTouch=now;
}, {passive:false});

/* expose a tiny hook so the page can be smoke-tested automatically */
window.__game = {
  state: state,
  correctSelector: function(){ return '.choice[data-val="'+ (state.target||"") +'"]'; },
  /* exposed so voice selection can be tested against mock voice lists —
     no speech engine is needed to check the picker's logic */
  pickVoiceFrom: pickVoiceFrom,
  voiceScore: voiceScore,
  currentVoiceName: function(){ var v=bestVoice(); return v? v.name : null; },
  countShown: function(){ return countBox.children.length; }
};

})();
</script>
